name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create Release from Tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag is on master
        run: |
          git fetch origin master:refs/remotes/origin/master
          if ! git merge-base --is-ancestor HEAD origin/master; then
            echo "::error::Tagged commit is not reachable from origin/master"
            exit 1
          fi

      - name: Validate tag against CMake project version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          content = Path("CMakeLists.txt").read_text(encoding="utf-8")
          content = re.sub(r"#\[(=*)\[.*?\]\1\]", "", content, flags=re.DOTALL)
          content = re.sub(r"#[^\n]*", "", content)
          project = re.search(r"\bproject\s*\(\s*theblas\b([^)]*)\)", content, re.IGNORECASE)
          version = re.search(r"\bVERSION\s+(\d+\.\d+\.\d+)(?=\s|$)", project[1], re.IGNORECASE) if project else None
          tag = os.environ["TAG"]
          if not version or not re.fullmatch(r"v\d+\.\d+\.\d+", tag) or tag[1:] != version[1]:
              raise SystemExit("Tag must equal v<CMake project VERSION> (X.Y.Z)")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version[1]}\ntag={tag}\n")
          PY

      - name: Check if release already exists
        id: release_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh api "repos/$GH_REPO/releases/tags/$TAG" >/dev/null 2>/tmp/release-check-error; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; skipping creation."
          elif grep -q 'HTTP 404' /tmp/release-check-error; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            cat /tmp/release-check-error >&2
            exit 1
          fi

      - name: Extract committed release notes
        if: steps.release_check.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 scripts/extract-changelog.py "$VERSION" > /tmp/release-notes.md

      - name: Create GitHub Release
        if: steps.release_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" --verify-tag \
            --title "theblas $TAG" \
            --notes-file /tmp/release-notes.md

  update-port:
    name: Open vcpkg Port Update PR
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.release.outputs.version }}
      TAG: ${{ needs.release.outputs.tag }}
      BRANCH: release/vcpkg-port-${{ needs.release.outputs.tag }}

    steps:
      - name: Checkout master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0

      - name: Check existing port PR and branch
        id: port_check
        run: |
          PR_COUNT=$(gh pr list --head "$BRANCH" --base master --state all --json number --jq 'length')
          if [[ "$PR_COUNT" != 0 ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Port PR for $TAG already exists; skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            REMOTE_BRANCH=$(git ls-remote --heads origin "refs/heads/$BRANCH")
            if [[ -n "$REMOTE_BRANCH" ]]; then
              echo "branch_exists=true" >> "$GITHUB_OUTPUT"
            else
              echo "branch_exists=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Update vcpkg port files
        if: steps.port_check.outputs.skip == 'false' && steps.port_check.outputs.branch_exists == 'false'
        run: |
          git switch -c "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TARBALL_URL="https://github.com/${GH_REPO}/archive/refs/tags/${TAG}.tar.gz"

          curl --fail --show-error --location --retry 3 "$TARBALL_URL" -o /tmp/theblas.tar.gz
          SHA512=$(sha512sum /tmp/theblas.tar.gz | awk '{print $1}')
          export SHA512

          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          portfile = Path("ports/theblas/portfile.cmake")
          content, count = re.subn(r"(\bSHA512\s+)[0-9a-fA-F]+", lambda m: m[1] + os.environ["SHA512"], portfile.read_text())
          if count != 1:
              raise SystemExit("Expected exactly one SHA512 in portfile.cmake")
          portfile.write_text(content)
          manifest = Path("ports/theblas/vcpkg.json")
          data = json.loads(manifest.read_text())
          data["version"] = os.environ["VERSION"]
          data.pop("port-version", None)
          manifest.write_text(json.dumps(data, indent=2) + "\n")
          PY

          git add ports/theblas/
          git diff --cached --quiet || git commit -m "chore(vcpkg): update port for $TAG"
          TREE_HASH=$(git rev-parse HEAD:ports/theblas)

          python3 - "$VERSION" "$TREE_HASH" <<'PY'
          import json, sys
          version, tree = sys.argv[1], sys.argv[2]
          with open("versions/t-/theblas.json") as f:
              data = json.load(f)
          entries = [e for e in data["versions"] if not (e.get("version") == version and e.get("port-version", 0) == 0)]
          entries.insert(0, {"version": version, "git-tree": tree, "port-version": 0})
          data["versions"] = entries
          with open("versions/t-/theblas.json", "w") as f:
              json.dump(data, f, indent=2)
              f.write("\n")

          with open("versions/baseline.json") as f:
              data = json.load(f)
          data["default"]["theblas"] = {"baseline": version, "port-version": 0}
          with open("versions/baseline.json", "w") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          PY
          git add versions/t-/theblas.json versions/baseline.json
          git diff --cached --quiet || git commit -m "chore(vcpkg): register $TAG"
          git push origin "HEAD:refs/heads/$BRANCH"

      - name: Open port update PR
        if: steps.port_check.outputs.skip == 'false'
        run: |
          gh pr create --base master --head "$BRANCH" \
            --title "chore(vcpkg): update theblas to $TAG" \
            --body "Updates the port archive checksum, version database, and baseline for $TAG. PRs opened with GITHUB_TOKEN do not trigger CI workflows on themselves; a maintainer must arrange validation before merging."
